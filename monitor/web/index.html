<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z Look Jamaican — Command Center</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Z</span><span>Z Look Jamaican</span></div>
      <div class="section-label">Command Center</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div><span>Monitor</span><strong>v1.0.0</strong></div>
        <div><span>Access</span><strong>Read-only</strong></div>
        <div><span>Source</span><strong id="source-short">—</strong></div>
        <div class="operational"><span class="dot"></span><span id="health-foot">Connecting…</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="status-row"><span class="pill success">◆ Autonomous</span><span class="status-dot"><i></i> Evidence Monitor</span><span class="status-dot"><i></i> Read-Only</span></div>
        <div class="top-right"><div><small>Heartbeat</small><strong id="heartbeat">—</strong></div><div><small>System Time</small><strong id="system-time">—</strong></div><div class="avatar">ZJ</div></div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
