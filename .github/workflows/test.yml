name: kernel-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q autonomous_kernel experiments tests monitor/app monitor/tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run preregistered Z8 real-data qualification
        run: |
          python experiments/z8_real_data_qualification.py --root . --output /tmp/z8-real-data-result.json
          cat /tmp/z8-real-data-result.json
      - name: Monitor contract tests
        run: python -m unittest discover -s monitor/tests -v
      - name: Validate durable state
        run: python -m autonomous_kernel validate
      - name: Verify authoritative monitor snapshot
        run: python -m autonomous_kernel monitor_snapshot --json > /tmp/monitor-snapshot.json
      - name: Verify clean recovery path
        run: python -m autonomous_kernel recover
      - name: Verify resumable status
        run: python -m autonomous_kernel status
