<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Z Look Jamaican — Command Center</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">Z</span><div><strong>Z Look Jamaican</strong><small>Autonomous Crypto Command Center</small></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div><span class="dot"></span><span id="side-health">Connecting</span></div>
      <small id="contract-version">Contract —</small>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div class="status-cluster">
        <span class="pill green">Autonomous</span>
        <span class="pill" id="strategy-stage">Stage —</span>
        <span class="pill" id="validation-state">Validation —</span>
      </div>
      <div class="top-right"><span><span class="dot"></span> Heartbeat <b id="heartbeat">—</b></span><span>Observed <b id="observed-at">—</b></span></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
